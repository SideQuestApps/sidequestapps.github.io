<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — SideQuest Apps</title>
  <meta name="description" content="Get in touch with Avineet Gupta about working together, or about any of the SideQuest apps." />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="icon" href="/assets/favicon/favicon.ico">

  <!-- Apple -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">

  <!-- Android / PWA -->
  <link rel="manifest" href="/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#0a0a0c">

  <!-- Type -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
  >

  <link rel="stylesheet" href="/styles.css?v=6" />

  <script src="/theme.js?v=2" defer></script>
  <script src="/footer.js?v=2" defer></script>
  <script src="/contact.js" defer></script>
</head>

<body>
  <div class="backdrop" aria-hidden="true">
    <span class="field field-1"></span>
    <span class="field field-2"></span>
    <span class="field field-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="shell">

    <!-- NAV -->
    <header class="site-header" id="top">
      <nav class="nav glass">
        <a href="/" aria-label="SideQuest Apps home">
          <img src="/assets/SideQuest_logo_full_bold.png" alt="SideQuest Apps" class="site-logo" />
        </a>


        <div class="nav-links" id="nav-links">
          <a href="/#apps" class="nav-link">Apps</a>
          <a href="/blog.html" class="nav-link">Blog</a>
          <a href="/contact.html" class="nav-link" aria-current="page">Contact</a>
          <a href="/privacy.html" class="nav-link">Privacy</a>
        </div>

        <div class="nav-actions">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle colour theme">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8V16Z" />
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM12 4V8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16V20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4Z" />
            </svg>
          </button>
          <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
            <span class="bar"></span><span class="bar"></span>
          </button>
        </div>
      </nav>
    </header>

    <main>

      <section class="wrap blog-intro">
        <div class="blog-intro-copy">
          <span class="kicker">Contact</span>
          <h1>Interested in working together?</h1>
          <p class="lede">
            Tell me a bit about what you have in mind, or ask about one of the apps. I'll reply by email.
          </p>
        </div>
      </section>

      <!-- FORM — handled by contact.js -->
      <section class="wrap contact-page">
        <div class="form-card glass glass-raised">
          <form id="contact-form" novalidate>
            <div class="form-grid">
              <div class="field-group">
                <label for="cf-name">Name</label>
                <input id="cf-name" name="name" type="text" autocomplete="name" required />
              </div>
              <div class="field-group">
                <label for="cf-mobile">Mobile <span class="optional">optional</span></label>
                <input id="cf-mobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel" />
              </div>
              <div class="field-group">
                <label for="cf-email">Email</label>
                <input id="cf-email" name="email" type="email" autocomplete="email" required />
              </div>
              <div class="field-group">
                <label for="cf-subject">Subject</label>
                <input id="cf-subject" name="subject" type="text" required />
              </div>
              <div class="field-group full">
                <label for="cf-message">Message</label>
                <textarea id="cf-message" name="message" rows="6" required></textarea>
              </div>
            </div>

            <!-- Spam trap: real visitors never see or fill this -->
            <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="cf-send">Send message</button>
              <p class="form-status" id="cf-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </section>

    </main>

    <footer class="site-footer" id="site-footer"></footer>

  </div>
</body>

</html>
